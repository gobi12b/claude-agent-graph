name: Release

# Every merge to main publishes a GitHub Release with the prebuilt programs the installers download.
# The tag is the Cargo.toml version, or the next patch after the latest tag if that version was already released.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//')
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$want" "$latest" | sort -V | tail -1)" = "$latest" ]; then
            IFS=. read -r ma mi pa <<< "$latest"
            want="$ma.$mi.$((pa + 1))"
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"
          echo "Releasing v$want"

  cross:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu.2.28, out: x86_64-unknown-linux-gnu/release/agent-graph, name: agent-graph-linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu.2.28, out: aarch64-unknown-linux-gnu/release/agent-graph, name: agent-graph-linux-arm64 }
          - { target: x86_64-pc-windows-gnu, features: window, out: x86_64-pc-windows-gnu/release/agent-graph.exe, name: agent-graph-windows-x86_64.exe }
          - { target: universal2-apple-darwin, out: universal2-apple-darwin/release/agent-graph, name: agent-graph-macos-universal }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip3 install ziglang cargo-zigbuild
      - name: Set version
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - run: cargo zigbuild --release --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - run: mkdir -p binaries && cp target/${{ matrix.out }} binaries/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: binaries/${{ matrix.name }}

  linux-window:
    needs: version
    # The window build links the system WebKitGTK, so build on the oldest supported runner for the widest glibc reach.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Set version
        run: sed -i '0,/^version = .*/s//version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - run: cargo build --release --features window
      - run: mkdir -p binaries && cp target/release/agent-graph binaries/agent-graph-linux-x86_64-window
      - uses: actions/upload-artifact@v4
        with:
          name: agent-graph-linux-x86_64-window
          path: binaries/agent-graph-linux-x86_64-window

  publish:
    needs: [version, cross, linux-window]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - name: Checksums
        working-directory: binaries
        run: |
          chmod +x agent-graph-*
          sha256sum agent-graph-* > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create release
        working-directory: binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release create "$TAG" agent-graph-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
