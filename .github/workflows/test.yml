name: Test

# Every push to a feature branch: Conventional Commit check and unit tests; main is covered by the release workflow.
on:
  push:
    branches-ignore: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: .github/scripts/lint-commits.sh origin/main..HEAD

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
